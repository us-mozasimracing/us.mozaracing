<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Automatically catch any /products/ link and redirect to root file
    var path = window.location.pathname;
    if (path.indexOf('/products/') !== -1) {
      var newPath = path.replace('/products/', '/');
      window.location.replace(newPath + window.location.search + window.location.hash);
    } else {
      window.location.replace('/us.mozaracing/');
    }
  </script>
</head>
<body style="background:#fff;font-family:sans-serif;text-align:center;padding:50px;">
  <p>Loading MOZA product...</p>
</body>
</html>
